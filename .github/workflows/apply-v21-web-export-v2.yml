name: Apply V21 web export v2

on:
  push:
    paths:
      - ".v21-patch/apply2.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Find exact patch fragment order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, itertools

          root = Path('.v21-patch')
          parts = {p.stem: p.read_text().strip() for p in root.glob('part*.b64')}
          gaps = {p.stem: p.read_text().strip() for p in root.glob('g*.b64')}
          expected = 'ec978f98411c7db384e0b9ad5aa97f40ce1075cd7e7c5958dd79cf20a6da8dc0'

          pkeys = ['part00','part01','part02','part03','part04']
          g10keys = ['g10','g20','g30']
          g11keys = ['g11','g21','g31']

          found = None
          tested = 0
          for pp in itertools.permutations(pkeys):
              for aa in itertools.permutations(g10keys):
                  for bb in itertools.permutations(g11keys):
                      text = ''.join([
                          parts[pp[0]], gaps['g00'],
                          parts[pp[1]], gaps[aa[0]], gaps[bb[0]],
                          parts[pp[2]], gaps[aa[1]], gaps[bb[1]],
                          parts[pp[3]], gaps[aa[2]], gaps[bb[2]],
                          parts[pp[4]], gaps['g40'],
                      ])
                      tested += 1
                      if len(text) != 160212:
                          continue
                      try:
                          raw = base64.b64decode(text, validate=True)
                      except Exception:
                          continue
                      if hashlib.sha256(raw).hexdigest() == expected:
                          found = (pp, aa, bb, raw)
                          break
                  if found:
                      break
              if found:
                  break

          if not found:
              raise SystemExit(f'No valid fragment order found after {tested} combinations')

          pp, aa, bb, raw = found
          print('part order:', pp)
          print('gap10 order:', aa)
          print('gap11 order:', bb)
          print('patch bytes:', len(raw))
          Path('/tmp/v21.pck.patch.zst').write_bytes(raw)
          PY

      - name: Rebuild V21 PCK
        shell: bash
        run: |
          set -euo pipefail
          echo "ec978f98411c7db384e0b9ad5aa97f40ce1075cd7e7c5958dd79cf20a6da8dc0  /tmp/v21.pck.patch.zst" | sha256sum -c -
          zstd -d --patch-from="VÉRTICE 5.pck" /tmp/v21.pck.patch.zst -o "/tmp/VÉRTICE 5.pck" -f
          test "$(stat -c%s "/tmp/VÉRTICE 5.pck")" = "30941116"
          echo "e2b3b94f1c595ec2db8dc207848be62ceb4ab614  /tmp/VÉRTICE 5.pck" | sha1sum -c -
          mv "/tmp/VÉRTICE 5.pck" "VÉRTICE 5.pck"

      - name: Commit V21 PCK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "VÉRTICE 5.pck"
          if git diff --cached --quiet; then
            echo "V21 PCK already applied."
            exit 0
          fi
          git commit -m "Update V21 web export PCK"
          git push
